# Use H2 Database (File based)
spring.datasource.url=jdbc:h2:file:./data/robot_db;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false

# spring.datasource.url=jdbc:mysql://localhost:3306/robot_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# spring.flyway.repair-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true
spring.flyway.clean-disabled=false

# H2 Database for testing (Fall back if MySQL is not available)
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driver-class-name=org.h2.Driver
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# Ollama settings (AI機能無効化のためコメントアウト)
# spring.ai.ollama.chat.options.model=go-expert
# spring.ai.ollama.base-url=http://127.0.0.1:11434
# spring.ai.ollama.chat.options.timeout=60s

# Spring AI機能を明示的に無効化
spring.ai.ollama.chat.enabled=false

server.port=8081

# Thymeleafのキャッシュを無効化（修正を即座に反映）
spring.thymeleaf.cache=false

# Basic Auth
basic.auth.user=${BASIC_AUTH_USER:admin}
basic.auth.password=${BASIC_AUTH_PASSWORD:password}
