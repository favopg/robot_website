# Use H2 Database (File based)
spring.datasource.url=jdbc:h2:file:./data/robot_db;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false

# spring.datasource.url=jdbc:mysql://localhost:3306/robot_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# H2 Database for testing (Fall back if MySQL is not available)
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driver-class-name=org.h2.Driver
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# Ollama settings
spring.ai.ollama.chat.options.model=llama3
spring.ai.ollama.base-url=http://localhost:11434

server.port=8081
