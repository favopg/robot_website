<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${releaseInfo.subject} + ' - リリースノート'">リリースノート詳細</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .navbar-custom { background-color: #004085; }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand { color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">推し囲碁棋士を見つけよう</a>
        </div>
    </nav>

    <main class="container py-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">トップ</a></li>
                <li class="breadcrumb-item"><a href="/release/list">リリースノート一覧</a></li>
                <li class="breadcrumb-item active" aria-current="page">詳細</li>
            </ol>
        </nav>

        <div class="card shadow-sm mt-4">
            <div class="card-header bg-white py-3">
                <h1 class="h3 mb-0" th:text="${releaseInfo.subject}">リリース件名</h1>
                <div class="text-muted small mt-2">
                    <i class="bi bi-clock"></i> 公開日: <span th:text="${#temporals.format(releaseInfo.createdAt, 'yyyy/MM/dd HH:mm')}">2026/08/14 21:00</span>
                </div>
            </div>
            <div class="card-body">
                <div class="mt-2" style="white-space: pre-wrap;" th:text="${releaseInfo.comment}">
                    リリースコメントの内容がここに表示されます。
                </div>
            </div>
            <div class="card-footer bg-light text-end">
                <a href="/" class="btn btn-outline-secondary">トップへ戻る</a>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 推し囲碁棋士を見つけよう</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        }
    </script>
</body>
</html>
