<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">YouTube配信予定</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .navbar-custom {
            background-color: #004085; /* 濃い青色 */
        }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand {
            color: white;
        }
        .navbar-custom .nav-link:hover {
            color: #d1ecf1;
        }
        /* タイトルが長い場合に折り返すための設定 */
        .table td {
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">制作者が役立つ囲碁情報サイト</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDarkDropdown" aria-controls="navbarNavDarkDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDarkDropdown">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDarkDropdownMenuLinkIgo" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-info-circle"></i> 囲碁情報
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarDarkDropdownMenuLinkIgo">
                            <!-- 一般イベント -->
                            <li><h6 class="dropdown-header">一般イベント</h6></li>
                            <li><a class="dropdown-item" href="/events"><i class="bi bi-calendar-event me-2"></i>イベント一覧</a></li>
                            
                            <li><hr class="dropdown-divider"></li>
                            
                            <!-- プロ棋士対局 -->
                            <li><h6 class="dropdown-header">プロ棋士対局</h6></li>
                            <li><a class="dropdown-item" href="/match-schedule"><i class="bi bi-clock-history me-2"></i>対局予定</a></li>
                            <li><a class="dropdown-item" href="/match-results"><i class="bi bi-trophy me-2"></i>対局結果</a></li>
                            
                            <li><hr class="dropdown-divider"></li>
                            
                            <!-- 動画配信 -->
                            <li><h6 class="dropdown-header">動画配信</h6></li>
                            <li><a class="dropdown-item" href="/youtube-schedule"><i class="bi bi-youtube me-2"></i>YouTube 配信予定</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <div class="form-check form-switch text-light">
                        <input class="form-check-input" type="checkbox" id="darkModeSwitch">
                        <label class="form-check-label" for="darkModeSwitch">ダークモード</label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-3">
        <header class="mb-3 border-bottom pb-2">
            <h1 class="h3 mb-1" th:text="${title}">YouTube 配信予定（日本棋院）</h1>
            <p class="text-muted small mb-0">日本棋院囲碁チャンネルのライブ配信予定を表示します。</p>
        </header>
        
        <main>
            <div class="table-responsive">
                <!--/* @thymesVar id="youtubeLives" type="java.util.List<com.example.robotwebsite.entity.YoutubeLive>" */-->
                <table class="table table-striped table-hover">
                    <thead class="table-info">
                        <tr>
                            <th>予定日時</th>
                            <th>タイトル</th>
                            <th>視聴リンク</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!--/* @thymesVar id="live" type="com.example.robotwebsite.entity.YoutubeLive" */-->
                        <tr th:each="live : ${youtubeLives}">
                            <td th:text="${live.scheduledStartText}">2026/07/25 10:00 に公開予定</td>
                            <td th:text="${live.title}">対局タイトル</td>
                            <td>
                                <a th:href="${live.liveUrl}" class="btn btn-sm btn-danger" target="_blank">YouTubeで見る</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(youtubeLives)}">
                            <td colspan="3" class="text-center">現在、配信予定はありません。</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ダークモード切り替え機能
        const darkModeSwitch = document.getElementById('darkModeSwitch');
        const htmlElement = document.documentElement;

        // 保存されたテーマを読み込む
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            htmlElement.setAttribute('data-bs-theme', savedTheme);
            darkModeSwitch.checked = (savedTheme === 'dark');
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            // システム設定がダークモードの場合
            htmlElement.setAttribute('data-bs-theme', 'dark');
            darkModeSwitch.checked = true;
        }

        darkModeSwitch.addEventListener('change', () => {
            if (darkModeSwitch.checked) {
                htmlElement.setAttribute('data-bs-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.setAttribute('data-bs-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
