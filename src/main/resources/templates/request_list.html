<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light" lang="ja">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>要望一覧 - 盤上の一手</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .navbar-custom {
            background-color: #004085; /* 濃い青色 */
        }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand {
            color: white;
        }
        .navbar-custom .nav-link:hover {
            color: #d1ecf1;
        }
        .status-badge-NEW { background-color: #ffc107; color: #000; }
        .status-badge-RESOLVED { background-color: #198754; color: #fff; }
        .status-badge-PENDING { background-color: #0dcaf0; color: #000; }
        
        /* テーブルの最小幅設定 */
        .table-responsive table {
            min-width: 600px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">盤上の一手</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDarkDropdown" aria-controls="navbarNavDarkDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDarkDropdown">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownKifu" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-journal-bookmark"></i> 本日の棋譜
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdownKifu">
                            <li><a class="dropdown-item" href="/recommended-kifu">おすすめ棋譜</a></li>
                            <li><a class="dropdown-item" href="/analyze">次の1手クイズ</a></li>
                            <li><a class="dropdown-item" href="/analyze-easy">次の１手クイズ(難易度易)</a></li>
                            <li><a class="dropdown-item" href="/kifu-list">棋譜一覧</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <div class="form-check form-switch text-light">
                        <input class="form-check-input" type="checkbox" id="darkModeSwitch">
                        <label class="form-check-label" for="darkModeSwitch">ダークモード</label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
            <h2 class="mb-0"><i class="bi bi-list-check"></i> 要望一覧</h2>
            <a href="/request" class="btn btn-success"><i class="bi bi-plus-lg"></i> 新規要望</a>
        </div>

        <div class="card shadow border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 15%">日時</th>
                                <th style="width: 25%">件名</th>
                                <th style="width: 45%">内容</th>
                                <th style="width: 15%">ステータス</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="request : ${requests}">
                                <td class="small" th:text="${request.createdAt != null ? #temporals.format(request.createdAt, 'yyyy/MM/dd HH:mm') : '-'}">2026/08/10 10:00</td>
                                <td class="fw-bold" th:text="${request.subject}">機能追加</td>
                                <td th:text="${request.message}">
                                    〇〇のような機能が欲しいです。
                                </td>
                                <td>
                                    <span class="badge" th:classappend="'status-badge-' + ${request.status}" th:text="${request.status}">NEW</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(requests)}">
                                <td colspan="4" class="text-center py-5 text-muted">
                                    現在、投稿されている要望はありません。
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 bg-light mt-auto border-top">
        <div class="container text-center">
            <div class="mb-2">
                <a href="/request" class="text-muted text-decoration-none mx-2 small">要望を投稿する</a>
                <span class="text-muted">|</span>
                <a href="/request/list" class="text-muted text-decoration-none mx-2 small">要望一覧</a>
                <span class="text-muted">|</span>
                <a href="/inquiry" class="text-muted text-decoration-none mx-2 small">バグを報告する</a>
                <span class="text-muted">|</span>
                <a href="/inquiry/list" class="text-muted text-decoration-none mx-2 small">報告一覧</a>
            </div>
            <p class="text-muted mb-0 small">&copy; 2026 盤上の一手</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ダークモード切り替え機能
            const darkModeSwitch = document.getElementById('darkModeSwitch');
            const htmlElement = document.documentElement;

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                htmlElement.setAttribute('data-bs-theme', savedTheme);
                if (darkModeSwitch) darkModeSwitch.checked = (savedTheme === 'dark');
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                htmlElement.setAttribute('data-bs-theme', 'dark');
                if (darkModeSwitch) darkModeSwitch.checked = true;
            }

            if (darkModeSwitch) {
                darkModeSwitch.addEventListener('change', () => {
                    if (darkModeSwitch.checked) {
                        htmlElement.setAttribute('data-bs-theme', 'dark');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        htmlElement.setAttribute('data-bs-theme', 'light');
                        localStorage.setItem('theme', 'light');
                    }
                });
            }
        });
    </script>
</body>
</html>
