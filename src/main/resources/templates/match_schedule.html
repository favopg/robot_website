<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>プロ棋士対局予定</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .navbar-custom {
            background-color: #004085; /* 濃い青色 */
        }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand {
            color: white;
        }
        .navbar-custom .nav-link:hover {
            color: #d1ecf1;
        }
        /* タイトルが長い場合に折り返すための設定 */
        .table td {
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }

        /* 推し棋士の強調スタイル */
        .highlight-favorite {
            border-left: 5px solid #ffc107 !important;
            background-color: rgba(255, 193, 7, 0.05);
        }
        .favorite-name {
            color: #856404;
            background-color: #fff3cd;
            padding: 0 4px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">制作者が役立つ囲碁情報サイト</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDarkDropdown" aria-controls="navbarNavDarkDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDarkDropdown">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDarkDropdownMenuLinkIgo" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-info-circle"></i> 囲碁情報
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarDarkDropdownMenuLinkIgo">
                            <!-- 一般イベント -->
                            <li><h6 class="dropdown-header">一般イベント</h6></li>
                            <li><a class="dropdown-item" href="/events"><i class="bi bi-calendar-event me-2"></i>イベント一覧</a></li>
                            
                            <li><hr class="dropdown-divider"></li>
                            
                            <!-- プロ棋士対局 -->
                            <li><h6 class="dropdown-header">プロ棋士対局</h6></li>
                            <li><a class="dropdown-item" href="/match-schedule"><i class="bi bi-clock-history me-2"></i>対局予定</a></li>
                            <li><a class="dropdown-item" href="/match-results"><i class="bi bi-trophy me-2"></i>対局結果</a></li>
                            
                            <li><hr class="dropdown-divider"></li>
                            
                            <!-- 動画配信 -->
                            <li><h6 class="dropdown-header">動画配信</h6></li>
                            <li><a class="dropdown-item" href="/youtube-schedule"><i class="bi bi-youtube me-2"></i>YouTube 配信予定</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-warning me-3" onclick="showFavoriteModal()">
                        <i class="bi bi-star-fill"></i> 推し棋士設定
                    </button>
                    <div class="form-check form-switch text-light">
                        <input class="form-check-input" type="checkbox" id="darkModeSwitch">
                        <label class="form-check-label" for="darkModeSwitch">ダークモード</label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-3">
        <header class="mb-3 border-bottom pb-2">
            <h1 class="h3 mb-1">プロ棋士対局予定・結果</h1>
            <p class="text-muted small mb-0">日本棋院から取得した直近1週間の対局結果と今後1週間の対局予定を表示します。</p>
        </header>
        
        <main>
            <!-- 検索窓の追加 -->
            <div class="row mb-3">
                <div class="col-md-4">
                    <input type="text" id="playerSearch" class="form-control form-control-sm" placeholder="棋士名でフィルター..." onkeyup="filterTable()" title="棋士名検索">
                </div>
                <div class="col-md-2">
                    <select id="ageFilter" class="form-select form-select-sm" onchange="filterTable()" title="年代別フィルター">
                        <option value="">全ての年代</option>
                        <option value="10">10代</option>
                        <option value="20">20代</option>
                        <option value="30">30代</option>
                        <option value="40">40代</option>
                        <option value="50">50代以上</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <!--/* @thymesVar id="matches" type="java.util.List<com.example.robotwebsite.entity.Match>" */-->
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>対局日</th>
                            <th>棋戦</th>
                            <th>対局者</th>
                            <th>結果</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!--/* @thymesVar id="match" type="com.example.robotwebsite.entity.Match" */-->
                        <tr th:each="match : ${matches}" class="match-row"
                            th:data-p1-birth="${match.player1BirthDate}"
                            th:data-p2-birth="${match.player2BirthDate}">
                            <td th:text="${match.matchDate}">2026-07-01</td>
                            <td th:text="${match.matchName}">本因坊戦</td>
                            <td class="player-names">
                                <span th:text="${(match.player1Sente != null && match.player1Sente) ? '△' : ''} + ${match.player1Name}">棋士A</span>
                                vs
                                <span th:text="${(match.player2Sente != null && match.player2Sente) ? '△' : ''} + ${match.player2Name}">棋士B</span>
                            </td>
                            <td th:text="${match.result}">-</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(matches)}">
                            <td colspan="4" class="text-center">現在、表示できる対局情報はありません。</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- 推し棋士登録モーダル -->
    <div class="modal fade" id="favoritePlayerModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">推し棋士を登録しましょう！</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="favoriteModalCloseBtn" style="display:none;"></button>
                </div>
                <div class="modal-body">
                    <p>推し棋士を登録すると、対局予定や結果で強調表示されます。</p>
                    <div class="mb-3">
                        <label for="favoritePlayerInput" class="form-label">棋士名（例：一力遼）</label>
                        <input type="text" id="favoritePlayerInput" class="form-control" placeholder="棋士名を入力">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="clearFavoritePlayer()">解除する</button>
                    <button type="button" class="btn btn-primary" onclick="saveFavoritePlayer()">登録する</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const favoritePlayer = localStorage.getItem('favoritePlayer');
            const modalDismissed = sessionStorage.getItem('favoriteModalDismissed_matchSchedule');

            if (!favoritePlayer && !modalDismissed) {
                showFavoriteModal(true);
            } else if (favoritePlayer) {
                applyHighlight(favoritePlayer);
            }

            // モーダルが閉じられたときにフラグをセットする（再表示防止）
            const modalEl = document.getElementById('favoritePlayerModal');
            modalEl.addEventListener('hidden.bs.modal', function () {
                sessionStorage.setItem('favoriteModalDismissed_matchSchedule', 'true');
            });
        });

        function showFavoriteModal(isFirst = false) {
            const modalEl = document.getElementById('favoritePlayerModal');
            const closeBtn = document.getElementById('favoriteModalCloseBtn');
            const input = document.getElementById('favoritePlayerInput');
            
            if (isFirst) {
                closeBtn.style.display = 'none';
            } else {
                closeBtn.style.display = 'block';
                input.value = localStorage.getItem('favoritePlayer') || '';
            }
            
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
        }

        function saveFavoritePlayer() {
            const name = document.getElementById('favoritePlayerInput').value.trim();
            if (name) {
                localStorage.setItem('favoritePlayer', name);
                bootstrap.Modal.getInstance(document.getElementById('favoritePlayerModal')).hide();
                location.reload();
            } else {
                alert('棋士名を入力してください');
            }
        }
        
        function clearFavoritePlayer() {
            localStorage.removeItem('favoritePlayer');
            sessionStorage.setItem('favoriteModalDismissed_matchSchedule', 'true');
            const modalEl = document.getElementById('favoritePlayerModal');
            const modalInstance = bootstrap.Modal.getInstance(modalEl);
            if (modalInstance) {
                modalInstance.hide();
            }
            location.reload();
        }

        function applyHighlight(favName) {
            const rows = document.querySelectorAll('.match-row');
            
            rows.forEach(row => {
                const playerNamesContainer = row.querySelector('.player-names');
                const playerNamesText = playerNamesContainer.textContent;
                
                if (playerNamesText.includes(favName)) {
                    row.classList.add('highlight-favorite');
                    
                    const nameSpans = row.querySelectorAll('.player-names span');
                    nameSpans.forEach(span => {
                        if (span.textContent.includes(favName)) {
                            span.classList.add('favorite-name');
                        }
                    });
                }
            });
        }

        function filterTable() {
            const query = document.getElementById('playerSearch').value.toLowerCase();
            const ageFilter = document.getElementById('ageFilter').value;
            const rows = document.querySelectorAll('.match-row');
            const today = new Date();

            rows.forEach(row => {
                const text = row.querySelector('.player-names').textContent.toLowerCase();
                
                // 年代フィルター判定
                let ageMatch = true;
                if (ageFilter !== "") {
                    const p1Birth = row.getAttribute('data-p1-birth');
                    const p2Birth = row.getAttribute('data-p2-birth');
                    
                    const checkAge = (birthStr) => {
                        if (!birthStr) return false;
                        const birth = new Date(birthStr);
                        let age = today.getFullYear() - birth.getFullYear();
                        if (today.getMonth() < birth.getMonth() || (today.getMonth() === birth.getMonth() && today.getDate() < birth.getDate())) {
                            age--;
                        }
                        if (ageFilter === "50") return age >= 50;
                        return age >= parseInt(ageFilter) && age < parseInt(ageFilter) + 10;
                    };
                    
                    ageMatch = checkAge(p1Birth) || checkAge(p2Birth);
                }

                const textMatch = text.includes(query);

                if (textMatch && ageMatch) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        // ダークモード切り替え機能
        const darkModeSwitch = document.getElementById('darkModeSwitch');
        const htmlElement = document.documentElement;

        // 保存されたテーマを読み込む
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            htmlElement.setAttribute('data-bs-theme', savedTheme);
            darkModeSwitch.checked = (savedTheme === 'dark');
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            // システム設定がダークモードの場合
            htmlElement.setAttribute('data-bs-theme', 'dark');
            darkModeSwitch.checked = true;
        }

        darkModeSwitch.addEventListener('change', () => {
            if (darkModeSwitch.checked) {
                htmlElement.setAttribute('data-bs-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.setAttribute('data-bs-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
