<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light" lang="ja">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>バグ報告 - 盤上の一手</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .navbar-custom {
            background-color: #004085; /* 濃い青色 */
        }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand {
            color: white;
        }
        .navbar-custom .nav-link:hover {
            color: #d1ecf1;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">盤上の一手</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDarkDropdown" aria-controls="navbarNavDarkDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDarkDropdown">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/recommended-kifu">本日のおすすめ棋譜</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/analyze">本日の次の１手クイズ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/analyze-easy">本日の次の１手クイズ(難易度易)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/kifu-list">棋譜一覧</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <div class="form-check form-switch text-light">
                        <input class="form-check-input" type="checkbox" id="darkModeSwitch">
                        <label class="form-check-label" for="darkModeSwitch">ダークモード</label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card shadow border-0">
                    <div class="card-header bg-danger text-white py-3">
                        <h3 class="mb-0"><i class="bi bi-bug"></i> バグ報告</h3>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted mb-4">サイトの不具合や改善の提案がございましたら、以下のフォームよりお知らせください。</p>
                        
                        <form id="inquiryForm" th:action="@{/inquiry/submit}" th:object="${inquiry}" method="post">
                            <div class="mb-3">
                                <label for="subject" class="form-label fw-bold">件名 <span class="badge bg-danger">必須</span></label>
                                <input type="text" class="form-control" id="subject" th:field="*{subject}" placeholder="〇〇ページで表示が崩れている" required>
                            </div>

                            <div class="mb-3">
                                <label for="message" class="form-label fw-bold">バグ内容 <span class="badge bg-danger">必須</span></label>
                                <textarea class="form-control" id="message" th:field="*{message}" rows="6" placeholder="例：&#10;1. 〇〇ページを開く&#10;2. △△ボタンを押す&#10;3. エラーメッセージが表示される" required></textarea>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">報告する</button>
                                <a href="/" class="btn btn-outline-secondary">キャンセル</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 bg-light mt-auto border-top">
        <div class="container text-center">
            <div class="mb-2">
                <a href="/request" class="text-muted text-decoration-none mx-2 small">要望を投稿する</a>
                <span class="text-muted">|</span>
                <a href="/request/list" class="text-muted text-decoration-none mx-2 small">要望一覧</a>
                <span class="text-muted">|</span>
                <a href="/inquiry" class="text-muted text-decoration-none mx-2 small">バグを報告する</a>
                <span class="text-muted">|</span>
                <a href="/inquiry/list" class="text-muted text-decoration-none mx-2 small">報告一覧</a>
            </div>
            <p class="text-muted mb-0 small">&copy; 2026 盤上の一手</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ダークモード切り替え機能
            const darkModeSwitch = document.getElementById('darkModeSwitch');
            const htmlElement = document.documentElement;

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                htmlElement.setAttribute('data-bs-theme', savedTheme);
                if (darkModeSwitch) darkModeSwitch.checked = (savedTheme === 'dark');
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                htmlElement.setAttribute('data-bs-theme', 'dark');
                if (darkModeSwitch) darkModeSwitch.checked = true;
            }

            if (darkModeSwitch) {
                darkModeSwitch.addEventListener('change', () => {
                    if (darkModeSwitch.checked) {
                        htmlElement.setAttribute('data-bs-theme', 'dark');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        htmlElement.setAttribute('data-bs-theme', 'light');
                        localStorage.setItem('theme', 'light');
                    }
                });
            }

            const form = document.getElementById('inquiryForm');
            if (form) {
                // クライアントサイドでの制限（localStorage）は、DB全体の件数を正確に把握できないため削除
                // サーバーサイドで制限チェックを行っています
            }
        });
    </script>
</body>
</html>
