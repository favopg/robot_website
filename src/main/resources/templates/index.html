<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>囲碁・将棋イベント情報</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom {
            background-color: #004085; /* 濃い青色 */
        }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand {
            color: white;
        }
        .navbar-custom .nav-link:hover {
            color: #d1ecf1;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">イベント情報</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDarkDropdown" aria-controls="navbarNavDarkDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDarkDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDarkDropdownMenuLinkIgo" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            囲碁
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarDarkDropdownMenuLinkIgo">
                            <li><a class="dropdown-item" href="#">初心者</a></li>
                            <li><a class="dropdown-item" href="#">級位者</a></li>
                            <li><a class="dropdown-item" href="#">有段者</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDarkDropdownMenuLinkShogi" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            将棋
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarDarkDropdownMenuLinkShogi">
                            <li><a class="dropdown-item" href="#">初心者</a></li>
                            <li><a class="dropdown-item" href="#">級位者</a></li>
                            <li><a class="dropdown-item" href="#">有段者</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <header class="mb-4">
            <h1 class="display-4">囲碁・将棋イベント情報</h1>
            <p class="lead">最新のイベント情報を表示します。</p>
        </header>
        
        <main>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ジャンル</th>
                            <th>日付</th>
                            <th>タイトル</th>
                            <th>場所</th>
                            <th>対象</th>
                            <th>詳細</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="event : ${events}">
                            <td>
                                <span th:if="${event.genre == 'IGO'}" class="badge bg-primary">囲碁</span>
                                <span th:if="${event.genre == 'SHOGI'}" class="badge bg-success">将棋</span>
                            </td>
                            <td th:text="${event.eventDate}">2026-01-01</td>
                            <td th:text="${event.title}">イベントタイトル</td>
                            <td th:text="${event.location}">開催場所</td>
                            <td>
                                <span th:if="${event.targetBeginner}" class="badge bg-info text-dark">初心者</span>
                                <span th:if="${event.targetKyuPlayer}" class="badge bg-info text-dark">級位者</span>
                                <span th:if="${event.targetDanPlayer}" class="badge bg-info text-dark">有段者</span>
                            </td>
                            <td>
                                <a th:if="${event.url}" th:href="${event.url}" class="btn btn-sm btn-outline-secondary" target="_blank">リンク</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(events)}">
                            <td colspan="6" class="text-center">現在、表示できるイベント情報はありません。</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
