<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>囲碁イベント情報</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom {
            background-color: #004085; /* 濃い青色 */
        }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand {
            color: white;
        }
        .navbar-custom .nav-link:hover {
            color: #d1ecf1;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">イベント情報</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDarkDropdown" aria-controls="navbarNavDarkDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDarkDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDarkDropdownMenuLinkIgo" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            囲碁
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarDarkDropdownMenuLinkIgo">
                            <li><a class="dropdown-item" href="/">イベント情報</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/match-results">プロ棋士対局結果</a></li>
                            <li><a class="dropdown-item" href="/match-schedule">プロ棋士対局予定</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/spring-ai">Spring AI</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <header class="mb-4">
            <h1 class="display-4">囲碁イベント情報</h1>
            <p class="lead">最新のイベント情報を表示します。</p>
        </header>
        
        <main>
            <!-- 検索窓の追加 -->
            <div class="mb-4">
                <input type="text" id="globalSearch" class="form-control" placeholder="イベント名でフィルター..." onkeyup="globalFilter()">
            </div>

            <!-- 既存のイベント情報セクション -->
            <section class="mb-5">
                <h2 class="border-bottom pb-2">囲碁イベント情報</h2>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>日付</th>
                                <th>タイトル</th>
                                <th>対象</th>
                                <th>詳細</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="event : ${events.content}" class="filterable-item">
                                <td th:text="${event.eventDate}">2026-01-01</td>
                                <td th:text="${event.title}" class="search-target">イベントタイトル</td>
                                <td>
                                    <span th:if="${event.targetBeginner}" class="badge bg-info text-dark">初心者</span>
                                    <span th:if="${event.targetKyuPlayer}" class="badge bg-info text-dark">級位者</span>
                                    <span th:if="${event.targetDanPlayer}" class="badge bg-info text-dark">有段者</span>
                                </td>
                                <td>
                                    <a th:if="${event.url}" th:href="${event.url}" class="btn btn-sm btn-outline-secondary" target="_blank">リンク</a>
                                </td>
                            </tr>
                            <tr th:if="${events.empty}">
                                <td colspan="4" class="text-center">現在、表示できるイベント情報はありません。</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- ページングナビゲーション -->
                <nav th:if="${events.totalPages > 1}" aria-label="Page navigation">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${events.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/(page=${events.number - 1})}" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, events.totalPages - 1)}" th:classappend="${i == events.number} ? 'active'">
                            <a class="page-link" th:href="@{/(page=${i})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${events.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/(page=${events.number + 1})}" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </section>
        </main>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function globalFilter() {
            const query = document.getElementById('globalSearch').value.toLowerCase();
            const rows = document.querySelectorAll('.filterable-item');

            rows.forEach(row => {
                const targetText = row.querySelector('.search-target').textContent.toLowerCase();
                if (targetText.includes(query)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
