<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spring AI サンプル - 囲碁イベント情報</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom {
            background-color: #004085; /* 濃い青色 */
        }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand {
            color: white;
        }
        .navbar-custom .nav-link:hover {
            color: #d1ecf1;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">イベント情報</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDarkDropdown" aria-controls="navbarNavDarkDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDarkDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDarkDropdownMenuLinkIgo" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            囲碁
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarDarkDropdownMenuLinkIgo">
                            <li><a class="dropdown-item" href="/">イベント情報</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/match-results">プロ棋士対局結果</a></li>
                            <li><a class="dropdown-item" href="/match-schedule">プロ棋士対局予定</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/spring-ai">Spring AI</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <header class="mb-4">
            <h1 class="display-4">Spring AI サンプル</h1>
            <p class="lead">任意のプロンプトを入力してAIに質問できます。</p>
        </header>

        <main>
            <section class="mb-5">
                <form th:action="@{/spring-ai/ask}" method="post" class="card p-4 shadow-sm">
                    <div class="mb-3">
                        <label for="prompt" class="form-label">プロンプトを入力してください：</label>
                        <textarea class="form-control" id="prompt" name="prompt" rows="3" required th:text="${prompt}" placeholder="例：囲碁の初心者向けの勉強法を教えて"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="askButton">AIに尋ねる</button>
                    <div id="loadingSpinner" class="spinner-border spinner-border-sm text-light d-none" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </form>
            </section>

            <script th:inline="javascript">
                document.querySelector('form').addEventListener('submit', function(event) {
                    const button = document.getElementById('askButton');
                    const spinner = document.getElementById('loadingSpinner');
                    
                    // 二重送信防止
                    if (button.disabled) {
                        event.preventDefault();
                        return;
                    }

                    button.disabled = true;
                    button.innerHTML = '考え中... ';
                    spinner.classList.remove('d-none');
                    button.appendChild(spinner);
                });
            </script>

            <section th:if="${response}" class="mb-5">
                <h2 class="border-bottom pb-2">AIの回答</h2>
                <div class="card p-4 bg-light border-info">
                    <div style="white-space: pre-wrap;" th:text="${response}">AIの回答がここに表示されます。</div>
                </div>
            </section>

            <section th:if="${error}" class="mb-5">
                <div class="alert alert-danger" role="alert" th:text="${error}">
                    エラーが発生しました。
                </div>
            </section>
        </main>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
