<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">対局情報</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .navbar-custom {
            background-color: #004085; /* 濃い青色 */
        }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand {
            color: white;
        }
        .navbar-custom .nav-link:hover {
            color: #d1ecf1;
        }
        /* タイトルが長い場合に折り返すための設定 */
        .table td {
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }
        .player-icon {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 50%;
            margin-right: 5px;
        }
        .player-icon-mobile {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 5px;
        }
        /* 本日の対局を強調するカスタムスタイル */
        .match-card.border-danger {
            box-shadow: 0 0 15px rgba(220, 53, 69, 0.4) !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">制作者が役立つ囲碁情報サイト</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDarkDropdown" aria-controls="navbarNavDarkDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDarkDropdown">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDarkDropdownMenuLinkIgo" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            囲碁
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarDarkDropdownMenuLinkIgo">
                            <li><a class="dropdown-item" href="/">イベント一覧</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/match-list">プロ棋士対局一覧</a></li>
                            <li><a class="dropdown-item" href="/match-results">プロ棋士対局結果</a></li>
                            <li><a class="dropdown-item" href="/match-schedule">プロ棋士対局予定</a></li>
                            <li><a class="dropdown-item" href="/youtube-schedule">YouTube 配信予定</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <div class="form-check form-switch text-light">
                        <input class="form-check-input" type="checkbox" id="darkModeSwitch">
                        <label class="form-check-label" for="darkModeSwitch">ダークモード</label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <header class="mb-4">
            <h1 class="display-4" th:text="${title}">対局情報</h1>
            <p class="lead" th:if="${title.contains('予定')}">今後の対局予定を表示します。</p>
            <p class="lead" th:if="${title.contains('結果')}">直近の対局結果を表示します。</p>
            <p class="lead" th:if="${title.contains('一覧')}">直近および今後の対局情報を表示します。</p>
        </header>
        
        <main>
            <!-- 月別リンクの追加 -->
            <div class="row mb-4" th:if="${months != null}">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title mb-3">月別結果</h5>
                            <div class="d-flex overflow-auto pb-2" style="white-space: nowrap; -webkit-overflow-scrolling: touch;">
                                <a href="/match-results?all=true" 
                                   class="btn btn-sm me-2" 
                                   th:classappend="${param.all != null && param.all[0] == 'true'} ? 'btn-info' : 'btn-outline-info'">全て</a>
                                <a href="/match-results" 
                                   class="btn btn-sm me-2" 
                                   th:classappend="${param.all == null && param.year == null && param.month == null} ? 'btn-secondary' : 'btn-outline-secondary'">直近</a>
                                <a th:each="m : ${months}" 
                                   th:with="parts=${m.split('-')}"
                                   th:href="@{/match-results(year=${parts[0]}, month=${parts[1]})}" 
                                   class="btn btn-sm me-2"
                                   th:classappend="${param.year != null && param.year[0] == parts[0] && param.month != null && param.month[0] == parts[1]} ? 'btn-primary' : 'btn-outline-primary'"
                                   th:text="${parts[0] + '年' + parts[1] + '月'}">
                                    2026年6月
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 検索窓の追加 -->
            <div class="row mb-3 align-items-center">
                <div class="col-md-6">
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" id="playerSearch" class="form-control border-start-0 ps-0" placeholder="棋士名または棋戦名で検索・フィルター..." onkeyup="filterTable()">
                    </div>
                </div>
                <div class="col-md-6" th:if="${title.contains('結果')}">
                    <span id="winLossResult" class="fw-bold" style="display:none;">
                        結果: <span id="winCount" class="text-danger">0</span>勝 
                        <span id="lossCount" class="text-primary">0</span>敗
                    </span>
                </div>
            </div>

            <!-- PC・モバイル共通のカードグリッド形式 -->
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-4">
                <div th:each="match : ${matches}" class="col match-item" th:data-winner="${match.winnerName}">
                    <div class="card h-100 shadow-sm border-0 border-top border-4 match-card"
                         th:classappend="${match.matchDate == today && !title.contains('結果')} ? 'border-danger border-3 shadow' : 'border-primary'">
                        <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center pt-3">
                            <span class="badge bg-secondary" th:text="${match.matchName}">棋戦名</span>
                            <small class="text-muted"><i class="bi bi-calendar3 me-1"></i><span th:text="${match.matchDate}">2026-07-01</span></small>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-around align-items-center player-names">
                                <!-- 対局者1 -->
                                <div class="text-center" style="flex: 1;">
                                    <div class="position-relative mb-2">
                                        <img th:if="${match.player1Icon != null}" th:src="${match.player1Icon}" 
                                             class="rounded-circle shadow-sm player-detail-trigger" style="width: 60px; height: 60px; object-fit: cover; cursor: pointer;" 
                                             alt="" th:data-player-name="${match.player1Name}">
                                        <div th:unless="${match.player1Icon != null}" 
                                             class="rounded-circle bg-light d-inline-flex align-items-center justify-content-center shadow-sm player-detail-trigger" 
                                             style="width: 60px; height: 60px; cursor: pointer;"
                                             th:data-player-name="${match.player1Name}">
                                            <i class="bi bi-person text-secondary fs-2"></i>
                                        </div>
                                        <span th:if="${match.player1Sente != null && match.player1Sente}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark">先</span>
                                    </div>
                                    <div th:classappend="${match.winnerName == match.player1Name} ? 'fw-bold text-danger' : ''">
                                        <span th:text="${match.player1Name}">棋士A</span>
                                    </div>
                                    <div th:if="${match.winnerName == match.player1Name}" class="mt-1">
                                        <span class="badge rounded-pill bg-danger">勝</span>
                                    </div>
                                </div>

                                <div class="col-auto px-2 text-muted fw-light">vs</div>

                                <!-- 対局者2 -->
                                <div class="text-center" style="flex: 1;">
                                    <div class="position-relative mb-2">
                                        <img th:if="${match.player2Icon != null}" th:src="${match.player2Icon}" 
                                             class="rounded-circle shadow-sm player-detail-trigger" style="width: 60px; height: 60px; object-fit: cover; cursor: pointer;" 
                                             alt="" th:data-player-name="${match.player2Name}">
                                        <div th:unless="${match.player2Icon != null}" 
                                             class="rounded-circle bg-light d-inline-flex align-items-center justify-content-center shadow-sm player-detail-trigger" 
                                             style="width: 60px; height: 60px; cursor: pointer;"
                                             th:data-player-name="${match.player2Name}">
                                            <i class="bi bi-person text-secondary fs-2"></i>
                                        </div>
                                        <span th:if="${match.player2Sente != null && match.player2Sente}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark">先</span>
                                    </div>
                                    <div th:classappend="${match.winnerName == match.player2Name} ? 'fw-bold text-danger' : ''">
                                        <span th:text="${match.player2Name}">棋士B</span>
                                    </div>
                                    <div th:if="${match.winnerName == match.player2Name}" class="mt-1">
                                        <span class="badge rounded-pill bg-danger">勝</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer bg-transparent border-top-0 text-center pb-3" th:if="${title.contains('結果')}">
                            <div class="p-2 bg-light rounded-2 small text-muted" th:text="${match.result}">結果詳細</div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(matches)}" class="text-center py-5 border rounded bg-light mb-4">
                <i class="bi bi-info-circle fs-1 text-muted d-block mb-2"></i>
                現在、表示できる対局情報はありません。
            </div>
        </main>
    </div>

    <!-- Player Detail Modal -->
    <div class="modal fade" id="playerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="playerName">棋士詳細</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="playerModalIcon" src="" class="rounded-circle mb-3 shadow-sm" style="width: 120px; height: 120px; object-fit: cover;">
                    <table class="table table-sm text-start">
                        <tr><th style="width: 30%;">性別</th><td id="playerGender"></td></tr>
                        <tr><th>段位</th><td id="playerRank"></td></tr>
                        <tr><th>出身地</th><td id="playerPlace"></td></tr>
                        <tr><th>所属</th><td id="playerAffiliation"></td></tr>
                    </table>
                    <div class="mt-3 text-end">
                        <a id="playerProfileLink" href="#" target="_blank" class="btn btn-outline-primary btn-sm">日本棋院プロフィール <i class="bi bi-box-arrow-up-right"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function filterTable() {
            const query = document.getElementById('playerSearch').value.toLowerCase();
            const items = document.querySelectorAll('.match-item');
            const resultArea = document.getElementById('winLossResult');
            
            let wins = 0;
            let losses = 0;

            items.forEach(item => {
                const playerNames = item.querySelector('.player-names').textContent.toLowerCase();
                const matchName = item.querySelector('.badge').textContent.toLowerCase();
                const text = playerNames + " " + matchName;
                const winnerName = item.getAttribute('data-winner') ? item.getAttribute('data-winner').toLowerCase() : "";

                if (query !== "" && text.includes(query)) {
                    item.classList.remove('d-none');
                    
                    if (winnerName !== "" && playerNames.includes(query) && winnerName.includes(query)) {
                        wins++;
                    } else if (winnerName !== "" && playerNames.includes(query)) {
                        losses++;
                    }
                } else if (query === "") {
                    item.classList.remove('d-none');
                } else {
                    item.classList.add('d-none');
                }
            });

            // 結果の表示更新
            if (resultArea) {
                if (query !== "") {
                    document.getElementById('winCount').textContent = wins;
                    document.getElementById('lossCount').textContent = losses;
                    resultArea.style.display = 'inline';
                } else {
                    resultArea.style.display = 'none';
                }
            }
        }

        function showPlayerDetail(name) {
            fetch(`/api/players/${encodeURIComponent(name)}`)
                .then(response => {
                    if (!response.ok) throw new Error('Player info not found');
                    return response.json();
                })
                .then(data => {
                    document.getElementById('playerName').textContent = data.name;
                    document.getElementById('playerGender').textContent = data.gender || '-';
                    document.getElementById('playerRank').textContent = data.rank || '-';
                    document.getElementById('playerPlace').textContent = data.birthPlace || '-';
                    document.getElementById('playerAffiliation').textContent = data.affiliation || '-';
                    document.getElementById('playerModalIcon').src = data.iconPath || '/images/players/default.jpg';
                    
                    const profileLink = document.getElementById('playerProfileLink');
                    if (data.profileUrl) {
                        profileLink.href = data.profileUrl;
                        profileLink.style.display = 'inline-block';
                    } else {
                        profileLink.style.display = 'none';
                    }
                    
                    new bootstrap.Modal(document.getElementById('playerModal')).show();
                })
                .catch(error => {
                    console.error('Error fetching player details:', error);
                    // 詳細が見つからない場合は名前だけ表示するか、アラートを出す
                    alert('棋士の詳細情報が登録されていません。');
                });
        }

        // イベントリスナーの登録
        document.addEventListener('DOMContentLoaded', function() {
            document.addEventListener('click', function(event) {
                const trigger = event.target.closest('.player-detail-trigger');
                if (trigger) {
                    const playerName = trigger.getAttribute('data-player-name');
                    if (playerName) {
                        showPlayerDetail(playerName);
                    }
                }
            });
        });

        // ダークモード切り替え機能
        const darkModeSwitch = document.getElementById('darkModeSwitch');
        const htmlElement = document.documentElement;

        // 保存されたテーマを読み込む
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            htmlElement.setAttribute('data-bs-theme', savedTheme);
            darkModeSwitch.checked = (savedTheme === 'dark');
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            // システム設定がダークモードの場合
            htmlElement.setAttribute('data-bs-theme', 'dark');
            darkModeSwitch.checked = true;
        }

        darkModeSwitch.addEventListener('change', () => {
            if (darkModeSwitch.checked) {
                htmlElement.setAttribute('data-bs-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.setAttribute('data-bs-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
