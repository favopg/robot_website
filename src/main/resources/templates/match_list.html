<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">対局情報</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .navbar-custom {
            background-color: #004085; /* 濃い青色 */
        }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand {
            color: white;
        }
        .navbar-custom .nav-link:hover {
            color: #d1ecf1;
        }
        /* タイトルが長い場合に折り返すための設定 */
        .table td {
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }
        .player-icon {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 50%;
            margin-right: 5px;
        }
        .player-icon-mobile {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">制作者が役立つ囲碁情報サイト</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDarkDropdown" aria-controls="navbarNavDarkDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDarkDropdown">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDarkDropdownMenuLinkIgo" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            囲碁
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarDarkDropdownMenuLinkIgo">
                            <li><a class="dropdown-item" href="/">イベント一覧</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/match-results">プロ棋士対局結果</a></li>
                            <li><a class="dropdown-item" href="/match-schedule">プロ棋士対局予定</a></li>
                            <li><a class="dropdown-item" href="/youtube-schedule">YouTube 配信予定</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <div class="form-check form-switch text-light">
                        <input class="form-check-input" type="checkbox" id="darkModeSwitch">
                        <label class="form-check-label" for="darkModeSwitch">ダークモード</label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <header class="mb-4">
            <h1 class="display-4" th:text="${title}">対局情報</h1>
            <p class="lead" th:if="${title.contains('予定')}">今後の対局予定を表示します。</p>
            <p class="lead" th:if="${title.contains('結果')}">直近の対局結果を表示します。</p>
        </header>
        
        <main>
            <!-- 月別リンクの追加 -->
            <div class="row mb-4" th:if="${months != null}">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title mb-3">月別結果</h5>
                            <div class="d-flex overflow-auto pb-2" style="white-space: nowrap; -webkit-overflow-scrolling: touch;">
                                <a href="/match-results?all=true" 
                                   class="btn btn-sm me-2" 
                                   th:classappend="${param.all != null && param.all[0] == 'true'} ? 'btn-info' : 'btn-outline-info'">全て</a>
                                <a href="/match-results" 
                                   class="btn btn-sm me-2" 
                                   th:classappend="${param.all == null && param.year == null && param.month == null} ? 'btn-secondary' : 'btn-outline-secondary'">直近</a>
                                <a th:each="m : ${months}" 
                                   th:with="parts=${m.split('-')}"
                                   th:href="@{/match-results(year=${parts[0]}, month=${parts[1]})}" 
                                   class="btn btn-sm me-2"
                                   th:classappend="${param.year != null && param.year[0] == parts[0] && param.month != null && param.month[0] == parts[1]} ? 'btn-primary' : 'btn-outline-primary'"
                                   th:text="${parts[0] + '年' + parts[1] + '月'}">
                                    2026年6月
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 検索窓の追加 -->
            <div class="row mb-3 align-items-center">
                <div class="col-md-6">
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" id="playerSearch" class="form-control border-start-0 ps-0" placeholder="棋士名で検索・フィルター..." onkeyup="filterTable()">
                    </div>
                </div>
                <div class="col-md-6" th:if="${title.contains('結果')}">
                    <span id="winLossResult" class="fw-bold" style="display:none;">
                        結果: <span id="winCount" class="text-danger">0</span>勝 
                        <span id="lossCount" class="text-primary">0</span>敗
                    </span>
                </div>
            </div>

            <div class="table-responsive d-none d-md-block">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>対局日</th>
                            <th>棋戦</th>
                            <th>対局者</th>
                            <th th:if="${title.contains('結果')}">結果</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="match : ${matches}" class="match-row" th:data-winner="${match.winnerName}">
                            <td th:text="${match.matchDate}">2026-07-01</td>
                            <td th:text="${match.matchName}">本因坊戦</td>
                            <td class="player-names">
                                <span th:classappend="${match.winnerName == match.player1Name} ? 'fw-bold text-danger' : ''">
                                    <img th:if="${match.player1Icon != null}" th:src="${match.player1Icon}" class="player-icon" alt="">
                                    <span th:text="${(match.player1Sente != null && match.player1Sente) ? '△' : ''} + ${match.player1Name}">棋士A</span>
                                    <span th:if="${match.winnerName == match.player1Name}" class="badge rounded-pill bg-danger ms-1">勝</span>
                                </span>
                                vs
                                <span th:classappend="${match.winnerName == match.player2Name} ? 'fw-bold text-danger' : ''">
                                    <img th:if="${match.player2Icon != null}" th:src="${match.player2Icon}" class="player-icon" alt="">
                                    <span th:text="${(match.player2Sente != null && match.player2Sente) ? '△' : ''} + ${match.player2Name}">棋士B</span>
                                    <span th:if="${match.winnerName == match.player2Name}" class="badge rounded-pill bg-danger ms-1">勝</span>
                                </span>
                            </td>
                            <td th:if="${title.contains('結果')}" th:text="${match.result}">-</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(matches)}">
                            <td colspan="4" class="text-center">現在、表示できる対局情報はありません。</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- モバイル向けカード形式 -->
            <div class="d-md-none">
                <div th:each="match : ${matches}" class="card mb-3 shadow-sm match-card" th:data-winner="${match.winnerName}">
                    <div class="card-header d-flex justify-content-between align-items-center bg-light">
                        <span class="badge bg-secondary" th:text="${match.matchName}">棋戦名</span>
                        <small class="text-muted" th:text="${match.matchDate}">2026-07-01</small>
                    </div>
                    <div class="card-body">
                        <div class="row align-items-center text-center player-names">
                            <div class="col-5">
                                <div th:classappend="${match.winnerName == match.player1Name} ? 'fw-bold text-danger' : ''">
                                    <div th:if="${match.player1Icon != null}">
                                        <img th:src="${match.player1Icon}" class="player-icon-mobile" alt="">
                                    </div>
                                    <span th:if="${match.player1Sente != null && match.player1Sente}" class="badge bg-dark me-1">先</span>
                                    <span th:text="${match.player1Name}">棋士A</span>
                                    <div th:if="${match.winnerName == match.player1Name}" class="mt-1">
                                        <span class="badge rounded-pill bg-danger">勝</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-2 text-muted small">vs</div>
                            <div class="col-5">
                                <div th:classappend="${match.winnerName == match.player2Name} ? 'fw-bold text-danger' : ''">
                                    <div th:if="${match.player2Icon != null}">
                                        <img th:src="${match.player2Icon}" class="player-icon-mobile" alt="">
                                    </div>
                                    <span th:if="${match.player2Sente != null && match.player2Sente}" class="badge bg-dark me-1">先</span>
                                    <span th:text="${match.player2Name}">棋士B</span>
                                    <div th:if="${match.winnerName == match.player2Name}" class="mt-1">
                                        <span class="badge rounded-pill bg-danger">勝</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-3 pt-2 border-top small text-muted text-center" th:if="${title.contains('結果')}" th:text="${match.result}">
                            結果詳細
                        </div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(matches)}" class="text-center py-4 border rounded bg-light">
                    現在、表示できる対局情報はありません。
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function filterTable() {
            const query = document.getElementById('playerSearch').value.toLowerCase();
            const items = document.querySelectorAll('.match-row, .match-card');
            const resultArea = document.getElementById('winLossResult');
            
            let wins = 0;
            let losses = 0;

            items.forEach(item => {
                const text = item.querySelector('.player-names').textContent.toLowerCase();
                const winnerName = item.getAttribute('data-winner') ? item.getAttribute('data-winner').toLowerCase() : "";

                if (query !== "" && text.includes(query)) {
                    item.style.setProperty('display', '', 'important');
                    
                    // 勝敗のカウント（検索ワードが勝者名に含まれていれば勝ち）
                    // テーブルとカードで2回カウントされないよう、片方の表示状態だけ見る必要があるが、
                    // ここではアイテムごとに判定し、最終的に2で割るか、種類を限定する必要がある。
                    // シンプルに、表示されているもの（かつ片方の形式のみ）でカウントする。
                    
                    // カウントは一回だけ行う（例えば match-row の方だけでカウント）
                    if (item.classList.contains('match-row')) {
                        if (winnerName !== "" && winnerName.includes(query)) {
                            wins++;
                        } else if (winnerName !== "") {
                            losses++;
                        }
                    }
                } else if (query === "") {
                    item.style.display = '';
                } else {
                    item.style.setProperty('display', 'none', 'important');
                }
            });

            // 結果の表示更新
            if (resultArea) {
                if (query !== "") {
                    document.getElementById('winCount').textContent = wins;
                    document.getElementById('lossCount').textContent = losses;
                    resultArea.style.display = 'inline';
                } else {
                    resultArea.style.display = 'none';
                }
            }
        }

        // ダークモード切り替え機能
        const darkModeSwitch = document.getElementById('darkModeSwitch');
        const htmlElement = document.documentElement;

        // 保存されたテーマを読み込む
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            htmlElement.setAttribute('data-bs-theme', savedTheme);
            darkModeSwitch.checked = (savedTheme === 'dark');
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            // システム設定がダークモードの場合
            htmlElement.setAttribute('data-bs-theme', 'dark');
            darkModeSwitch.checked = true;
        }

        darkModeSwitch.addEventListener('change', () => {
            if (darkModeSwitch.checked) {
                htmlElement.setAttribute('data-bs-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.setAttribute('data-bs-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
