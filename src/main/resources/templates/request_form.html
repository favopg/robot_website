<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>要望投稿 - 推し棋士が見つかる囲碁棋士情報サイト</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .navbar-custom {
            background-color: #004085; /* 濃い青色 */
        }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand {
            color: white;
        }
        .navbar-custom .nav-link:hover {
            color: #d1ecf1;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">推し棋士が見つかる囲碁棋士情報サイト</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDarkDropdown" aria-controls="navbarNavDarkDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDarkDropdown">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/match-schedule">
                            <i class="bi bi-clock-history"></i> 対局予定
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/match-results">
                            <i class="bi bi-trophy"></i> 対局結果
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownTitles" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-journal-text"></i> 囲碁棋戦
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdownTitles">
                            <li><a class="dropdown-item" href="/kisei-info">棋聖戦の仕組み</a></li>
                            <li><a class="dropdown-item" href="/meijin-info">名人戦の仕組み</a></li>
                            <li><a class="dropdown-item" href="/honinbo-info">本因坊戦の仕組み</a></li>
                            <li><a class="dropdown-item" href="/ouza-info">王座戦の仕組み</a></li>
                            <li><a class="dropdown-item" href="/tengen-info">天元戦の仕組み</a></li>
                            <li><a class="dropdown-item" href="/gosei-info">碁聖戦の仕組み</a></li>
                            <li><a class="dropdown-item" href="/judan-info">十段戦の仕組み</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" id="navbarDropdownRequest" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-chat-left-text"></i> 要望投稿
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdownRequest">
                            <li><a class="dropdown-item active" href="/request">要望を投稿する</a></li>
                            <li><a class="dropdown-item" href="/request/list">要望一覧</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownBug" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-bug"></i> バグ報告
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdownBug">
                            <li><a class="dropdown-item" href="/inquiry">バグを報告する</a></li>
                            <li><a class="dropdown-item" href="/inquiry/list">報告一覧</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card shadow border-0">
                    <div class="card-header bg-success text-white py-3">
                        <h3 class="mb-0"><i class="bi bi-chat-left-text"></i> 要望投稿</h3>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted mb-4">サイトへの要望や追加してほしい機能などがございましたら、以下のフォームよりお知らせください。</p>
                        
                        <form id="requestForm" th:action="@{/request/submit}" th:object="${request}" method="post">
                            <div class="mb-3">
                                <label for="subject" class="form-label fw-bold">件名 <span class="badge bg-danger">必須</span></label>
                                <input type="text" class="form-control" id="subject" th:field="*{subject}" placeholder="新機能の提案" required>
                            </div>

                            <div class="mb-3">
                                <label for="message" class="form-label fw-bold">要望内容 <span class="badge bg-danger">必須</span></label>
                                <textarea class="form-control" id="message" th:field="*{message}" rows="6" placeholder="例：&#10;〇〇のような機能があると嬉しいです。" required></textarea>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">要望を送信する</button>
                                <a href="/" class="btn btn-outline-secondary">キャンセル</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 bg-light mt-auto border-top">
        <div class="container text-center text-muted">
            <small>&copy; 2026 囲碁棋士情報サイト</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('requestForm');
            const STORAGE_KEY = 'request_limit_data';
            const MAX_REQUESTS = 3;

            function getRequestData() {
                const data = localStorage.getItem(STORAGE_KEY);
                const now = new Date();
                const currentMonth = now.getFullYear() + '-' + (now.getMonth() + 1);

                if (data) {
                    const parsed = JSON.parse(data);
                    if (parsed.month === currentMonth) {
                        return parsed;
                    }
                }
                return { month: currentMonth, count: 0 };
            }

            function saveRequestData(data) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            // 初期ロード時のチェック
            const initialData = getRequestData();
            if (initialData.count >= MAX_REQUESTS) {
                const submitBtn = form.querySelector('button[type="submit"]');
                if (submitBtn) {
                    submitBtn.classList.add('disabled');
                    submitBtn.title = '今月の要望制限（3件）に達しました。';
                }
            }

            form.addEventListener('submit', function(event) {
                const data = getRequestData();

                if (data.count >= MAX_REQUESTS) {
                    alert('今月の要望投稿制限（3件）に達したため、送信できません。');
                    event.preventDefault();
                    return;
                }

                // 送信時にカウントアップ
                data.count++;
                saveRequestData(data);
            });
        });
    </script>
</body>
</html>
