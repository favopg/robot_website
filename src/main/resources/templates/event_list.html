<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>イベント一覧 - 制作者が役立つ囲碁情報サイト</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .navbar-custom {
            background-color: #004085; /* 濃い青色 */
        }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand {
            color: white;
        }
        .navbar-custom .nav-link:hover {
            color: #d1ecf1;
        }
        .table td {
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">制作者が役立つ囲碁情報サイト</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDarkDropdown" aria-controls="navbarNavDarkDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDarkDropdown">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDarkDropdownMenuLinkIgo" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-info-circle"></i> 囲碁情報
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarDarkDropdownMenuLinkIgo">
                            <!-- 一般イベント -->
                            <li><h6 class="dropdown-header">一般イベント</h6></li>
                            <li><a class="dropdown-item" href="/events"><i class="bi bi-calendar-event me-2"></i>イベント一覧</a></li>
                            
                            <li><hr class="dropdown-divider"></li>
                            
                            <!-- プロ棋士対局 -->
                            <li><h6 class="dropdown-header">プロ棋士対局</h6></li>
                            <li><a class="dropdown-item" href="/match-list"><i class="bi bi-list-ul me-2"></i>対局一覧</a></li>
                            <li><a class="dropdown-item" href="/match-schedule"><i class="bi bi-clock-history me-2"></i>対局予定</a></li>
                            <li><a class="dropdown-item" href="/match-results"><i class="bi bi-trophy me-2"></i>対局結果</a></li>
                            
                            <li><hr class="dropdown-divider"></li>
                            
                            <!-- 動画配信 -->
                            <li><h6 class="dropdown-header">動画配信</h6></li>
                            <li><a class="dropdown-item" href="/youtube-schedule"><i class="bi bi-youtube me-2"></i>YouTube 配信予定</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <div class="form-check form-switch text-light">
                        <input class="form-check-input" type="checkbox" id="darkModeSwitch">
                        <label class="form-check-label" for="darkModeSwitch">ダークモード</label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-3">
        <main>
            <div class="mb-3">
                <input type="text" id="globalSearch" class="form-control" placeholder="イベント名でフィルター..." onkeyup="globalFilter()" title="イベント検索">
            </div>

            <section class="mb-4">
                <h2 class="h4 border-bottom pb-2">イベント情報</h2>

                <!--/* @thymesVar id="events" type="org.springframework.data.domain.Page<com.example.robotwebsite.entity.Event>" */-->
                <nav th:if="${events.totalPages > 1}" aria-label="Page navigation" class="mb-3">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${events.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/events(page=${events.number - 1})}" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, events.totalPages - 1)}" th:classappend="${i == events.number} ? 'active'">
                            <a class="page-link" th:href="@{/events(page=${i})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${events.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/events(page=${events.number + 1})}" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>

                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>日付</th>
                                <th>タイトル</th>
                                <th>詳細</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="event : ${events.content}" class="filterable-item">
                                <td th:text="${event.eventDate}">2026-01-01</td>
                                <td th:text="${event.title}" class="search-target">イベントタイトル</td>
                                <td>
                                    <a th:if="${event.url}" th:href="${event.url}" class="btn btn-sm btn-outline-secondary" target="_blank">リンク</a>
                                </td>
                            </tr>
                            <tr th:if="${events.isEmpty()}">
                                <td colspan="3" class="text-center">現在、表示できるイベント情報はありません。</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <nav th:if="${events.totalPages > 1}" aria-label="Page navigation">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${events.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/events(page=${events.number - 1})}" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, events.totalPages - 1)}" th:classappend="${i == events.number} ? 'active'">
                            <a class="page-link" th:href="@{/events(page=${i})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${events.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/events(page=${events.number + 1})}" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function globalFilter() {
            const query = document.getElementById('globalSearch').value.toLowerCase();
            const rows = document.querySelectorAll('.filterable-item');
            rows.forEach(row => {
                const targetText = row.querySelector('.search-target').textContent.toLowerCase();
                if (targetText.includes(query)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        const darkModeSwitch = document.getElementById('darkModeSwitch');
        const htmlElement = document.documentElement;
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            htmlElement.setAttribute('data-bs-theme', savedTheme);
            darkModeSwitch.checked = (savedTheme === 'dark');
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            htmlElement.setAttribute('data-bs-theme', 'dark');
            darkModeSwitch.checked = true;
        }
        darkModeSwitch.addEventListener('change', () => {
            if (darkModeSwitch.checked) {
                htmlElement.setAttribute('data-bs-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.setAttribute('data-bs-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
