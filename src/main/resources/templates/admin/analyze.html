<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>棋譜解析 - 管理画面</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .navbar-custom {
            background-color: #343a40;
        }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand {
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">管理画面 - 棋譜解析</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/request">要望管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/inquiry">バグ報告管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/release">リリース管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/">サイトを表示</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h3 class="mb-0"><i class="bi bi-cpu"></i> SGFファイル解析</h3>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/analyze}" method="post" enctype="multipart/form-data">
                            <div class="mb-4">
                                <label for="sgfFile" class="form-label fw-bold">SGFファイル <span class="badge bg-danger">必須</span></label>
                                <input class="form-control" type="file" id="sgfFile" name="file" accept=".sgf" required>
                                <div class="form-text">解析対象のSGFファイル（.sgf）を選択してください。</div>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-play-circle"></i> 解析
                                </button>
                                <a href="/" class="btn btn-outline-secondary">キャンセル</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 bg-light mt-auto border-top">
        <div class="container text-center text-muted">
            <small>&copy; 2026 囲碁棋士情報サイト 管理画面</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
