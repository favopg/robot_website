<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>【管理】バグ報告メンテナンス</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* テーブルの最小幅設定 */
        .table-responsive table {
            min-width: 600px;
        }
    </style>
</head>
<body class="container py-4">
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
        <h2 class="mb-0"><i class="bi bi-bug-fill"></i> バグ報告ステータス管理</h2>
        <div>
            <a href="/admin/release" class="btn btn-outline-success btn-sm me-2">リリース管理へ</a>
            <a href="/admin/request" class="btn btn-outline-primary btn-sm me-2">要望管理へ</a>
            <a href="/" class="btn btn-outline-secondary btn-sm">サイトへ戻る</a>
        </div>
    </div>

    <form id="deleteForm" th:action="@{/admin/inquiry/delete}" method="post"></form>

    <div class="mb-3">
        <button type="button" class="btn btn-danger" onclick="confirmDelete()">
            <i class="bi bi-trash"></i> 選択した項目を削除
        </button>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover mt-4">
                <thead class="table-dark">
                <tr>
                    <th style="width: 40px;"><input type="checkbox" id="selectAll"></th>
                    <th style="width: 60px;">No</th>
                    <th style="width: 200px;">件名</th>
                    <th>内容</th>
                    <th style="width: 120px;">現在の状態</th>
                    <th style="width: 150px;">アクション</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="inq, stat : ${inquiries}">
                    <td><input type="checkbox" name="ids" th:value="${inq.id}" class="row-checkbox"></td>
                    <td th:text="${stat.count}">1</td>
                    <td class="fw-bold" th:text="${inq.subject}">件名</td>
                    <td th:text="${inq.message}">
                        内容
                    </td>
                    <td>
                        <span class="badge" 
                              th:classappend="${inq.status == 'NEW' ? 'bg-warning text-dark' : (inq.status == 'RESOLVED' ? 'bg-success' : 'bg-info')}" 
                              th:text="${inq.status}">NEW</span>
                    </td>
                    <td>
                        <div class="d-flex gap-2">
                            <form th:action="@{/admin/inquiry/update-status}" method="post" class="d-flex gap-2 m-0">
                                <input type="hidden" name="id" th:value="${inq.id}">
                                <select name="status" class="form-select form-select-sm" style="width: auto;">
                                    <option value="NEW" th:selected="${inq.status == 'NEW'}">NEW</option>
                                    <option value="PENDING" th:selected="${inq.status == 'PENDING'}">PENDING</option>
                                    <option value="RESOLVED" th:selected="${inq.status == 'RESOLVED'}">RESOLVED</option>
                                </select>
                                <button type="submit" class="btn btn-primary btn-sm">更新</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(inquiries)}">
                    <td colspan="6" class="text-center py-5 text-muted">
                        管理対象のバグ報告はありません。
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        document.getElementById('selectAll').addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => cb.checked = this.checked);
        });

        function confirmDelete() {
            const checked = document.querySelectorAll('.row-checkbox:checked');
            if (checked.length === 0) {
                alert('削除する項目を選択してください。');
                return;
            }
            if (confirm('選択した項目を削除してもよろしいですか？')) {
                const deleteForm = document.getElementById('deleteForm');
                deleteForm.querySelectorAll('input[name="ids"]').forEach(el => el.remove());
                checked.forEach(cb => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'ids';
                    input.value = cb.value;
                    deleteForm.appendChild(input);
                });
                deleteForm.submit();
            }
        }
    </script>
</body>
</html>
