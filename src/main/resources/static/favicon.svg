<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="0.48" stop-color="#f5d28f"/>
      <stop offset="1" stop-color="#c98a36"/>
    </linearGradient>
    <radialGradient id="whiteStone" cx="35%" cy="25%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#f4f4f2"/>
      <stop offset="1" stop-color="#cfcfc9"/>
    </radialGradient>
    <radialGradient id="blackStone" cx="30%" cy="22%" r="78%">
      <stop offset="0" stop-color="#4a4a47"/>
      <stop offset="0.5" stop-color="#161715"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#6f4a1d" flood-opacity=".28"/>
    </filter>
    <filter id="stoneShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0.4" dy="1" stdDeviation=".8" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>

  <!-- rounded wooden/gold tile -->
  <rect x="2.1" y="2.1" width="27.8" height="27.8" rx="6.2"
        fill="url(#tile)" stroke="#e2b55f" stroke-width=".7" filter="url(#tileShadow)"/>

  <!-- subtle inner highlight -->
  <path d="M7 3.7h17.8c2.1 0 3.5 1.5 3.5 3.6v2.2C25.5 6.2 20.7 4.1 7 4.1Z"
        fill="#fff" opacity=".22"/>

  <!-- white Go stone -->
  <circle cx="15.9" cy="13.5" r="7.25" fill="url(#whiteStone)"
          stroke="#d5d5d0" stroke-width=".35" filter="url(#stoneShadow)"/>
  <ellipse cx="13.8" cy="10.7" rx="2.6" ry="1.65" fill="#fff" opacity=".48"/>

  <!-- black Go stone, slightly overlapping -->
  <circle cx="21.2" cy="20.6" r="7.15" fill="url(#blackStone)"
          stroke="#080808" stroke-width=".4" filter="url(#stoneShadow)"/>
  <ellipse cx="18.9" cy="17.9" rx="2.15" ry="1.25" fill="#fff" opacity=".16"/>
</svg>
