name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 1. ビルド前にファイルを退避（ワイルドカードを使用して確実に移動）
    - name: Move problematic file away from Gradle
      run: |
        mkdir -p /home/runner/temp_tsuji
        mv src/main/resources/static/images/players/辻*.jpg /home/runner/temp_tsuji/

    - name: Build and Test with Gradle
      run: ./gradlew build --info
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0
        JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
        LANG: ja_JP.UTF-8

    # 2. ビルド完了後、ファイルを成果物ディレクトリに配置
    - name: Restore and Deploy problematic resource
      run: |
        mkdir -p build/resources/main/static/images/players/
        cp /home/runner/temp_tsuji/辻*.jpg build/resources/main/static/images/players/
        # 次回ビルドのために元の場所にも戻す
        mv /home/runner/temp_tsuji/辻*.jpg src/main/resources/static/images/players/

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/test-results/test/