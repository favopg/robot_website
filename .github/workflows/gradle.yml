name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    # ジョブ全体で日本語ロケールを有効にする
    env:
      LANG: ja_JP.UTF-8
      LC_ALL: ja_JP.UTF-8

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install locale
      run: |
        sudo apt-get update
        sudo apt-get install -y locales
        sudo locale-gen ja_JP.UTF-8
        sudo update-locale LANG=ja_JP.UTF-8

    - name: Install Playwright Browsers
      run: ./gradlew playwrightInstall

    # 1. 非ASCII文字（日本語等）を含むファイルを安全に退避
    - name: Move problematic files away from Gradle
      run: |
        mkdir -p /home/runner/temp_resources
        # LC_ALL=C を使い、非ASCII文字を含むファイルを検索して移動
        find src/main/resources/static/images/players/ -name '*[! -~]*' -exec mv {} /home/runner/temp_resources/ \;

    - name: Build and Test with Gradle
      run: ./gradlew build --info --no-daemon --no-watch-fs
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0
        JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

    # 2. 退避したファイルを成果物ディレクトリと元の場所に復元
    - name: Restore resources
      run: |
        mkdir -p build/resources/main/static/images/players/
        # 退避していたファイルをコピー（元のファイル名で復元される）
        cp /home/runner/temp_resources/* build/resources/main/static/images/players/ || true
        mv /home/runner/temp_resources/* src/main/resources/static/images/players/ || true

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/test-results/test/