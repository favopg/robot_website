name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Gradleの事前スキャンによるエラー回避のため、ファイルを一時退避
    - name: Move problematic file away from Gradle
      run: |
        mv "src/main/resources/static/images/players/辻󠄀篤仁.jpg" /home/runner/temp_tsuji.jpg

    - name: Build and Test with Gradle
      run: ./gradlew build --info
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0
        JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
        LANG: ja_JP.UTF-8

    # ビルド完了後、ファイルを成果物ディレクトリと元の場所に配置
    - name: Restore and Deploy problematic resource
      run: |
        mkdir -p build/resources/main/static/images/players/
        cp /home/runner/temp_tsuji.jpg build/resources/main/static/images/players/辻󠄀篤仁.jpg
        mv /home/runner/temp_tsuji.jpg "src/main/resources/static/images/players/辻󠄀篤仁.jpg"

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/test-results/test/
